<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patients — Clinova Healthcare</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg">
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/typography.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/forms.css">
  <link rel="stylesheet" href="../../assets/css/tables.css">
  <link rel="stylesheet" href="../../assets/css/utilities.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body>
  <div class="app" id="app"></div>
  <script type="module">
    import { initShell, getPageContent } from '../../components/app-shell.js';
    import { DataTable, Format, Toast, Modal } from '../../components/ui.js';
    import { patients } from '../../api/patients.js';
    import { todayStr } from '../../api/appointments.js';

    let patientTable;

    initShell(['RECEPTIONIST', 'ADMIN'], (session) => {
      const page = getPageContent();
      page.innerHTML = `
        <div class="page-header">
          <div class="page-header__info">
            <h1 class="text-page-title">Patients</h1>
          </div>
          <div class="page-header__actions">
            <button class="btn btn--primary" id="btn-register">
              <svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-plus"></use></svg>
              Register Patient
            </button>
          </div>
        </div>

        <div class="card" style="margin-bottom: var(--sp-6);">
          <div class="card__header" style="padding: var(--sp-3) var(--sp-4);">
            <div class="search-bar" style="max-width: 300px; margin: 0;">
              <span class="search-bar__icon"><svg class="icon icon--sm" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-search"></use></svg></span>
              <input type="text" class="search-bar__input" id="patient-search" placeholder="Search by name, MRN, phone...">
            </div>
          </div>
          <div id="patients-table"></div>
        </div>
      `;

      // Setup Table
      const columns = [
        { key: 'mrn', label: 'MRN', sortable: true },
        { key: 'name', label: 'Patient Name', sortable: true, render: r => `<strong>${r.name}</strong><br><span class="text-caption">${r.gender}, ${Format.age(r.dateOfBirth)} yrs</span>` },
        { key: 'phone', label: 'Phone', sortable: false },
        { key: 'createdAt', label: 'Registered', sortable: true, render: r => Format.date(r.createdAt) },
        { key: 'actions', label: '', width: '170px', render: r => `
          <a href="../shared/patient-profile.html?id=${r.id}" class="btn btn--ghost btn--sm">View</a>
          <a href="appointments.html?patientId=${r.id}" class="btn btn--primary btn--sm">Book</a>
        `}
      ];

      patientTable = new DataTable('patients-table', columns, patients.list(), {
        searchInputId: 'patient-search',
        defaultSort: 'createdAt',
        emptyTitle: 'No patients found',
        emptyIcon: 'icon-users',
        emptyAction: `<button class="btn btn--primary" onclick="document.getElementById('btn-register').click()">Register New Patient</button>`
      });
      patientTable.sortAsc = false; // Sort descending by default
      patientTable._sortData();
      patientTable.render();

      // Register Button
      document.getElementById('btn-register').addEventListener('click', () => {
        showRegisterModal(session.staffId);
      });
    });

    function showRegisterModal(staffId) {
      const fee = patients.getRegistrationFee();

      const formHtml = `
        <form id="register-form" novalidate style="display:flex;flex-direction:column;gap:var(--sp-4);">
          <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4);">
            <div class="form-group">
              <label class="form-group__label">Full Name *</label>
              <input type="text" class="form-input" name="name" required>
            </div>
            <div class="form-group">
              <label class="form-group__label">Phone Number *</label>
              <input type="tel" class="form-input" name="phone" required pattern="^\\+?\\d{10,14}$">
            </div>
          </div>
          <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4);">
            <div class="form-group">
              <label class="form-group__label">Date of Birth *</label>
              <input type="date" class="form-input" name="dob" id="reg-dob" required max="${todayStr()}">
            </div>
            <div class="form-group">
              <label class="form-group__label">Gender *</label>
              <select class="form-input" name="gender" required>
                <option value="">Select...</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>
          <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4);">
            <div class="form-group">
              <label class="form-group__label">Address</label>
              <input type="text" class="form-input" name="address">
            </div>
            <div class="form-group">
              <label class="form-group__label">Allergies (comma separated)</label>
              <input type="text" class="form-input" name="allergies" placeholder="e.g. Penicillin, Peanuts">
            </div>
          </div>
          <div class="form-group">
            <label class="form-group__label">Blood Group</label>
            <select class="form-input" name="bloodGroup">
              <option value="">Unknown</option>
              <option value="A+">A+</option><option value="A-">A-</option>
              <option value="B+">B+</option><option value="B-">B-</option>
              <option value="AB+">AB+</option><option value="AB-">AB-</option>
              <option value="O+">O+</option><option value="O-">O-</option>
            </select>
          </div>

          <div id="guardian-section" style="display:none; padding:var(--sp-4); background:var(--bg); border-radius:var(--radius-md); border:1px solid var(--border);">
            <div class="text-card-title" style="margin-bottom:var(--sp-3); font-size:0.875rem;">Guardian Details (Required for under 18)</div>
            <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4);">
              <div class="form-group">
                <label class="form-group__label">Guardian Name *</label>
                <input type="text" class="form-input" name="guardianName" id="reg-guardian-name">
              </div>
              <div class="form-group">
                <label class="form-group__label">Guardian Phone *</label>
                <input type="tel" class="form-input" name="guardianPhone" id="reg-guardian-phone">
              </div>
            </div>
          </div>
        </form>

        <!-- Step 2: registration fee -->
        <div id="reg-pay-panel" style="display:none;">
          <p class="text-body-sm" style="margin-bottom:var(--sp-4);">Collect the registration fee. The patient ID (MRN) is generated once payment is received.</p>
          <div id="reg-summary" style="padding:var(--sp-4);background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:var(--sp-4);"></div>
          <div class="form-group">
            <label class="form-group__label">Registration Fee</label>
            <div class="text-page-title">${Format.money(fee)}</div>
          </div>
          <div class="form-group">
            <label class="form-group__label">Payment Method</label>
            <select class="form-input" id="reg-pay-method">
              <option value="CASH">Cash</option>
              <option value="UPI">UPI</option>
              <option value="CARD">Credit/Debit Card</option>
            </select>
          </div>
        </div>

        <!-- Step 3: done -->
        <div id="reg-done-panel" style="display:none;text-align:center;padding:var(--sp-4) 0;">
          <div class="text-caption">Patient ID (MRN)</div>
          <div id="reg-done-mrn" class="text-page-title" style="margin:var(--sp-2) 0;"></div>
          <div id="reg-done-info" class="text-body-sm" style="margin-bottom:var(--sp-6);"></div>
          <div style="display:flex;gap:var(--sp-3);justify-content:center;">
            <button type="button" class="btn btn--secondary" id="reg-done-close">Close</button>
            <a class="btn btn--primary" id="reg-done-book" href="#">Book Appointment</a>
          </div>
        </div>
      `;

      const actionsHtml = `
        <button class="btn btn--secondary" id="reg-cancel" type="button">Cancel</button>
        <button class="btn btn--secondary" id="reg-back" type="button" style="display:none;">Back</button>
        <button class="btn btn--primary" id="reg-next" type="button">Continue to Payment</button>
      `;

      const m = Modal.show({ title: 'Register New Patient', content: formHtml, size: 'md', actions: actionsHtml });

      const form = document.getElementById('register-form');
      const payPanel = document.getElementById('reg-pay-panel');
      const donePanel = document.getElementById('reg-done-panel');
      const btnCancel = document.getElementById('reg-cancel');
      const btnBack = document.getElementById('reg-back');
      const btnNext = document.getElementById('reg-next');
      let step = 1;
      let data = null;

      btnCancel.addEventListener('click', m.close);
      document.getElementById('reg-done-close').addEventListener('click', m.close);

      // Guardian logic
      const dobInput = document.getElementById('reg-dob');
      const gSection = document.getElementById('guardian-section');
      const gName = document.getElementById('reg-guardian-name');
      const gPhone = document.getElementById('reg-guardian-phone');

      dobInput.addEventListener('change', (e) => {
        if (!e.target.value) return;
        const age = patients.calculateAge(e.target.value);
        const minor = age < 18;
        gSection.style.display = minor ? 'block' : 'none';
        gName.required = minor;
        gPhone.required = minor;
      });

      const showStep = (n) => {
        step = n;
        form.style.display = n === 1 ? 'flex' : 'none';
        payPanel.style.display = n === 2 ? 'block' : 'none';
        btnBack.style.display = n === 2 ? '' : 'none';
        btnNext.textContent = n === 2 ? 'Receive Payment & Register' : 'Continue to Payment';
      };

      btnBack.addEventListener('click', () => showStep(1));

      btnNext.addEventListener('click', () => {
        // ---- Step 1 -> 2: validate details, check duplicates, then ask for payment ----
        if (step === 1) {
          if (!form.checkValidity()) { form.reportValidity(); return; }
          data = {
            name: form.name.value.trim(),
            phone: form.phone.value.trim(),
            dateOfBirth: form.dob.value,
            gender: form.gender.value,
            address: form.address.value.trim(),
            allergies: form.allergies.value.trim() ? form.allergies.value.trim().split(',').map(s => s.trim()).filter(Boolean) : [],
            bloodGroup: form.bloodGroup.value,
            guardianName: gName.value.trim(),
            guardianPhone: gPhone.value.trim()
          };
          try {
            patients.precheck(data);
          } catch (err) {
            Toast.show(err.message, 'error');
            return;
          }
          document.getElementById('reg-summary').innerHTML =
            `<strong>${data.name}</strong><br><span class="text-caption">${data.gender}, ${Format.age(data.dateOfBirth)} yrs · ${data.phone}</span>`;
          showStep(2);
          return;
        }

        // ---- Step 2: take payment and register ----
        if (step === 2) {
          try {
            btnNext.disabled = true;
            const method = document.getElementById('reg-pay-method').value;
            const { patient, bill } = patients.registerAndPay(data, { method }, staffId);

            patientTable.updateData(patients.list());

            // show the result
            form.style.display = 'none';
            payPanel.style.display = 'none';
            donePanel.style.display = 'block';
            btnCancel.style.display = 'none';
            btnBack.style.display = 'none';
            btnNext.style.display = 'none';
            document.getElementById('reg-done-mrn').textContent = patient.mrn;
            document.getElementById('reg-done-info').textContent =
              `${patient.name} registered. Registration fee ${Format.money(bill.totalAmount)} paid (${method}).`;
            document.getElementById('reg-done-book').href = `appointments.html?patientId=${patient.id}`;
            Toast.show(`Registered with MRN ${patient.mrn}.`);
          } catch (err) {
            Toast.show(err.message, 'error');
            btnNext.disabled = false;
          }
        }
      });
    }
  </script>
</body>
</html>
