<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Prescriptions — Clinova Healthcare</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg">
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/typography.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/forms.css">
  <link rel="stylesheet" href="../../assets/css/tables.css">
  <link rel="stylesheet" href="../../assets/css/utilities.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">

</head>
<body>
  <div class="app" id="app"></div>
  <script type="module">
    import { initShell, getPageContent } from '../../components/app-shell.js';
    import { DataTable, Format, Badge, Modal, Toast } from '../../components/ui.js';
    import { prescriptions } from '../../api/prescriptions.js';
    import { db } from '../../data/db.js';

    let rxTable;
    let currentUser;

    initShell(['DOCTOR'], (session) => {
      currentUser = session;
      const page = getPageContent();
      
      window.safeGet = function(collection, id) {
        if (!id) return null;
        try {
          return db.getById(collection, id);
        } catch {
          return null;
        }
      };

      window.escapeHtml = function(str) {
        if (str == null) return '';
        return String(str).replace(/[&<>"']/g, match => {
          const escapeMap = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
          return escapeMap[match];
        });
      };
      
      page.innerHTML = `
        <div class="page-header">
          <div class="page-header__info">
            <h1 class="text-page-title">My Prescriptions</h1>
          </div>
        </div>

        <div class="card" style="margin-bottom: var(--sp-6);">
          <div class="card__header" style="padding: var(--sp-3) var(--sp-4);">
            <div class="form-group" style="margin:0;">
              <select class="form-input" id="filter-status">
                <option value="">All Statuses</option>
                <option value="PENDING">Pending</option>
                <option value="DISPENSED">Dispensed</option>
                <option value="PARTIALLY_DISPENSED">Partially Dispensed</option>
                <option value="CANCELLED">Cancelled</option>
              </select>
            </div>
            <div class="form-group" style="margin:0; margin-left:var(--sp-4);">
              <input type="text" class="form-input" id="search-rx" placeholder="Search patient or medicine...">
            </div>
          </div>
          <div id="rx-table"></div>
        </div>
      `;

      // Setup Table
      const columns = [
        { key: 'createdAt', label: 'Date', sortable: true, render: r => Format.date(r.createdAt) },
        { key: 'patientId', label: 'Patient', sortable: true, render: r => {
          const p = window.safeGet('patients', r.patientId);
          return `<strong>${window.escapeHtml(p ? p.name : 'Unknown patient')}</strong>`;
        }},
        { key: 'items', label: 'Items', sortable: false, render: r => (Array.isArray(r.items) ? r.items : []).map(i => window.escapeHtml(i.name)).join(', ') },
        { key: 'status', label: 'Status', sortable: true, render: r => Badge.status(r.status) },
        { key: 'actions', label: '', width: '130px', render: r => {
          let html = `<div class="table-actions">`;
          html += `<button class="btn btn--secondary btn--sm btn-view" data-id="${r.id}">View</button>`;
          if (r.status === 'PENDING') {
            html += `<button class="btn btn--danger btn--sm btn--icon btn-cancel" data-id="${r.id}" title="Cancel prescription" aria-label="Cancel prescription"><svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-x"></use></svg></button>`;
          }
          html += `</div>`;
          return html;
        }}
      ];

      rxTable = new DataTable('rx-table', columns, [], { 
        defaultSort: 'createdAt',
        searchInputId: 'search-rx',
        emptyTitle: 'No Prescriptions Found',
        emptyIcon: 'icon-file-text'
      });
      rxTable.sortAsc = false;
      loadRx();

      // Filters
      document.getElementById('filter-status').addEventListener('change', loadRx);

      // Event Delegation
      document.getElementById('rx-table').addEventListener('click', (e) => {
        const viewBtn = e.target.closest('.btn-view');
        if (viewBtn) return showRx(viewBtn.dataset.id);
        
        const cancelBtn = e.target.closest('.btn-cancel');
        if (cancelBtn) {
          Modal.confirm({
            title: 'Cancel Prescription',
            message: 'Are you sure you want to cancel this pending prescription?',
            confirmStyle: 'danger',
            onConfirm: () => {
              prescriptions.cancel(cancelBtn.dataset.id);
              Toast.show('Prescription cancelled.');
              loadRx();
            }
          });
        }
      });
    });

    function loadRx() {
      const status = document.getElementById('filter-status').value;
      if (!currentUser || !currentUser.staffId) {
        rxTable.updateData([]);
        return;
      }
      const data = prescriptions.list(status ? { status, doctorId: currentUser.staffId } : { doctorId: currentUser.staffId });
      rxTable.updateData(data);
    }

    function showRx(id) {
      const rx = prescriptions.getById(id);
      if (!rx) return Toast.show('Prescription not found', 'error');
      
      const p = window.safeGet('patients', rx.patientId) || { name: 'Unknown patient', mrn: '-', dateOfBirth: null, gender: '-', allergies: [] };
      const doc = window.safeGet('staff', rx.doctorId) || { name: 'Unknown doctor' };
      const items = Array.isArray(rx.items) ? rx.items : [];
      
      const buildRxHtml = () => `
        <style>
          .rx-doc { font-family: system-ui, -apple-system, sans-serif; color: #1f2937; font-size: 14px; line-height: 1.5; padding: 1rem; }
          .rx-doc .header { display: flex; justify-content: space-between; border-bottom: 2px solid #05668D; padding-bottom: 20px; margin-bottom: 20px; }
          .rx-doc .logo { height: 48px; width: auto; margin-bottom: 8px; }
          .rx-doc .hospital-name { font-size: 18px; font-weight: 600; color: #05668D; }
          .rx-doc .hospital-info { font-size: 12px; color: #64748b; }
          .rx-doc .rx-title { font-size: 24px; font-weight: 700; margin: 0 0 4px 0; color: #05668D; }
          .rx-doc .info-text { font-size: 12px; color: #475569; }
          .rx-doc .patient-box { padding: 16px; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 20px; }
          .rx-doc .patient-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
          .rx-doc .patient-details { font-size: 13px; color: #475569; }
          .rx-doc .allergies { color: #dc2626; font-size: 13px; margin-top: 8px; font-weight: 500; }
          .rx-doc .notes { padding: 12px; background: #fffbeb; border: 1px solid #fef3c7; color: #b45309; border-radius: 6px; margin-bottom: 20px; font-size: 13px; }
          .rx-doc table { width: 100%; border-collapse: collapse; margin-bottom: 40px; }
          .rx-doc th { background: #f8fafc; font-weight: 600; text-align: left; padding: 12px; border-bottom: 2px solid #e2e8f0; font-size: 13px; color: #475569; text-transform: uppercase; }
          .rx-doc td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
          .rx-doc tr { page-break-inside: avoid; }
          .rx-doc .signature-area { margin-top: 60px; text-align: right; page-break-inside: avoid; }
          .rx-doc .signature-line { display: inline-block; width: 200px; border-top: 1px solid #1f2937; padding-top: 8px; font-size: 13px; }
          .rx-doc .footer { margin-top: 40px; text-align: center; font-size: 11px; color: #94a3b8; border-top: 1px solid #e2e8f0; padding-top: 8px; }
          @media print {
            @page { size: A4; margin: 14mm; }
            body { margin: 0; padding: 0; background: white; }
            .rx-doc { padding: 0; }
            .rx-doc .footer { position: fixed; bottom: 0; left: 0; width: 100%; background: white; }
          }
        </style>
        <div class="rx-doc" id="print-area">
          <div class="header">
            <div>
              <img src="${window.location.origin}${window.location.pathname.substring(0, window.location.pathname.indexOf('/pages/'))}/assets/images/logo.svg" class="logo" alt="Clinova Logo" onload="window.printReady = true;" onerror="window.printReady = true;">
              <div class="hospital-name">CLINOVA HEALTHCARE</div>
              <div class="hospital-info">Care. Precision. Trust.</div>
              <div class="hospital-info">MG Road, Ernakulam, Kerala</div>
            </div>
            <div style="text-align: right;">
              <h1 class="rx-title">PRESCRIPTION</h1>
              <div class="info-text">Prescription ID: ${window.escapeHtml(rx.id)}</div>
              <div class="info-text">Date: ${Format.date(rx.createdAt)}</div>
              <div class="info-text">Doctor: ${window.escapeHtml(doc.name)}</div>
            </div>
          </div>

          <div class="patient-box">
            <div class="patient-name">${window.escapeHtml(p.name)}</div>
            <div class="patient-details">MRN: ${window.escapeHtml(p.mrn)} | ${Format.age(p.dateOfBirth)} yrs | ${window.escapeHtml(p.gender)}</div>
            ${p.allergies && p.allergies.length ? `<div class="allergies">Allergies: ${window.escapeHtml(p.allergies.join(', '))}</div>` : ''}
          </div>

          ${rx.notes ? `<div class="notes"><strong>Doctor's Notes:</strong><br>${window.escapeHtml(rx.notes)}</div>` : ''}

          <table>
            <thead>
              <tr>
                <th>Medicine</th>
                <th>Dosage</th>
                <th>Frequency</th>
                <th>Duration</th>
                <th style="text-align: center;">Qty</th>
              </tr>
            </thead>
            <tbody>
              ${items.map(i => `
                <tr>
                  <td style="font-weight: 500;">${window.escapeHtml(i.name)}</td>
                  <td>${window.escapeHtml(i.dosage)}</td>
                  <td>${window.escapeHtml(i.frequency)}</td>
                  <td>${window.escapeHtml(i.duration)}</td>
                  <td style="text-align: center;">${window.escapeHtml(i.quantity)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>

          <div class="signature-area">
            <div class="signature-line">Doctor's Signature</div>
          </div>

          <div class="footer">
            Clinova Healthcare — Generated ${new Date().toLocaleString()}
          </div>
        </div>
      `;
      
      const content = buildRxHtml();

      window._printRx = function() {
        const printWindow = window.open('', '_blank');
        if (!printWindow) {
          Toast.show('Allow pop-ups to print', 'warning');
          return;
        }
        printWindow.document.write(`
          <!DOCTYPE html>
          <html>
          <head>
            <title>Prescription - ${window.escapeHtml(p.name)}</title>
          </head>
          <body` + `>
            ${buildRxHtml()}
            <script>
              let attempts = 0;
              const checkReady = () => {
                if (window.printReady || attempts > 10) {
                  window.print();
                } else {
                  attempts++;
                  setTimeout(checkReady, 50);
                }
              };
              checkReady();
            </scr` + `ipt>
          </body` + `>
          </html` + `>
        `);
        printWindow.document.close();
      };

      const actions = `
        <button class="btn btn--secondary" onclick="window._printRx()">
          <svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-printer"></use></svg>
          Print
        </button>
      `;

      Modal.show({ title: 'Prescription Details', content, size: 'lg', actions });
    }
  </script>
</body>
</html>
