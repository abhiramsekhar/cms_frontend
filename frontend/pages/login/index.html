<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — Clinova Healthcare</title>
  <meta name="description" content="Sign in to Clinova Healthcare Clinic Management System">
  <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg">
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/typography.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/forms.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
  <style>
    /* Override layout for the image-based design */
    body {
      background: #fbfbfb;
    }
    .login-layout {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .login-layout__visual {
      height: 220px;
      background: url('../../assets/images/clinova-login-page.png') no-repeat left top;
      background-size: cover;
      display: block;
    }
    .login-visual__inner {
      display: none !important; /* Hide HTML content, use image */
    }
    .login-form__logo-mobile {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      margin-bottom: var(--sp-8);
    }
    .login-form__logo-mobile img { width: 36px; height: auto; }
    .login-form__logo-mobile span { font-size: 1.25rem; font-weight: 600; color: var(--navy-900); }
    .login-footer {
      text-align: center;
      margin-top: var(--sp-8);
      font-size: 0.75rem;
      color: var(--muted);
    }
    
    @media (min-width: 1024px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-layout {
        width: 1024px;
        height: 463px;
        min-height: auto;
        background: url('../../assets/images/clinova-login-page.png') no-repeat left top;
        background-size: 1024px 463px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        border-radius: 12px;
        position: relative;
        display: block;
        margin: auto;
      }
      .login-layout__visual {
        display: none !important;
      }
      .login-layout__form {
        position: absolute;
        top: 0;
        right: 0;
        width: 440px; 
        height: 100%;
        display: block;
        padding: 0;
      }
      .login-form-wrapper {
        margin: 164px 0 0 50px; 
        width: 340px;
        max-width: none;
      }
      /* Hide baked-in texts to reveal image */
      .login-form-wrapper > h1, 
      .login-form-wrapper > p.text-caption, 
      .login-footer,
      .login-form__logo-mobile,
      .form-group__label {
        display: none !important;
      }
      .form-group {
        margin-bottom: 22px !important;
      }
      .form-banner {
        position: absolute;
        top: 90px;
        left: 50px;
        width: 340px;
        z-index: 10;
      }
      #session-expired {
        top: 130px;
      }
    }
  </style>
</head>
<body>
  <div class="login-layout">
    <!-- Left visual panel -->
    <div class="login-layout__visual">
      <div class="login-visual__inner">
        <div class="login-visual__hero">
          <img src="../../assets/images/login/hero-placeholder.svg" alt="" aria-hidden="true" style="opacity:0.2;">
        </div>
        <div class="login-visual__content">
          <img src="../../assets/images/logo-mark.svg" alt="" class="login-visual__logo" aria-hidden="true">
          <div class="login-visual__name">Clinova Healthcare</div>
          <div class="login-visual__tagline">Care. Precision. Trust.</div>
        </div>
      </div>
    </div>

    <!-- Right form panel -->
    <div class="login-layout__form">
      <div class="login-form-wrapper">
        <div class="login-form__logo-mobile">
          <img src="../../assets/images/logo-mark.svg" alt="Clinova">
          <span>Clinova Healthcare</span>
        </div>

        <h1 class="text-page-title" style="margin-bottom: var(--sp-1);">Welcome back</h1>
        <p class="text-caption" style="margin-bottom: var(--sp-6);">Sign in to your account to continue</p>

        <!-- Error banner (hidden by default) -->
        <div class="form-banner form-banner--error" id="login-error" style="display:none;">
          <svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-alert-circle"></use></svg>
          <span id="login-error-text"></span>
        </div>

        <!-- Session expired notice -->
        <div class="form-banner form-banner--success" id="session-expired" style="display:none;">
          <svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-info"></use></svg>
          <span>Your session has expired. Please sign in again.</span>
        </div>

        <form id="login-form" autocomplete="on" novalidate>
          <div class="form-group" style="margin-bottom: var(--sp-4);">
            <label class="form-group__label" for="username">Username</label>
            <input type="text" class="form-input" id="username" name="username"
                   placeholder="Enter your username" autocomplete="username" required autofocus>
          </div>

          <div class="form-group" style="margin-bottom: var(--sp-6);">
            <label class="form-group__label" for="password">Password</label>
            <div class="form-password">
              <input type="password" class="form-input" id="password" name="password"
                     placeholder="Enter your password" autocomplete="current-password" required>
              <button type="button" class="form-password__toggle" id="toggle-password" aria-label="Show password">
                <svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-eye"></use></svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn--primary btn--lg" style="width:100%;" id="login-btn">
            Sign in
          </button>
        </form>
        <p class="text-caption" style="text-align: center; margin-top: var(--sp-4);">Contact your system administrator if you cannot sign in.</p>

        <div class="login-footer">
          &copy; 2026 Clinova Healthcare
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth } from '../../api/auth.js';
    import { session } from '../../core/session.js';
    import { seed, isSeeded } from '../../data/seed.js';
    import { getDashboardPath } from '../../core/guard.js';

    // If already logged in, redirect to dashboard
    const existing = session.get();
    if (existing) {
      window.location.replace('../../' + getDashboardPath(existing.role));
    }

    // Auto-seed if not seeded
    if (!isSeeded()) {
      document.getElementById('login-btn').textContent = 'Loading system data…';
      document.getElementById('login-btn').disabled = true;
      await seed();
      document.getElementById('login-btn').textContent = 'Sign in';
      document.getElementById('login-btn').disabled = false;
    }

    // Show session expired notice
    if (new URLSearchParams(window.location.search).has('expired')) {
      document.getElementById('session-expired').style.display = 'flex';
    }

    // Form submission
    const form = document.getElementById('login-form');
    const errorBanner = document.getElementById('login-error');
    const errorText = document.getElementById('login-error-text');
    const loginBtn = document.getElementById('login-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBanner.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        errorText.textContent = 'Please enter both username and password.';
        errorBanner.style.display = 'flex';
        return;
      }

      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="btn__spinner"></span> Signing in…';

      try {
        const result = await auth.login(username, password);
        // Redirect to role dashboard
        window.location.href = '../../' + getDashboardPath(result.user.role);
      } catch (err) {
        errorText.textContent = err.message || 'An error occurred. Please try again.';
        errorBanner.style.display = 'flex';
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign in';
      }
    });

    // Password toggle
    const toggleBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      toggleBtn.innerHTML = `<svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-eye${isPassword ? '-off' : ''}"></use></svg>`;
    });
  </script>
</body>
</html>
