<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pharmacy Dashboard — Clinova Healthcare</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg">
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/typography.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/forms.css">
  <link rel="stylesheet" href="../../assets/css/tables.css">
  <link rel="stylesheet" href="../../assets/css/utilities.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body>
  <div class="app" id="app"></div>
  <script type="module">
    import { initShell, getPageContent } from '../../components/app-shell.js';
    import { db } from '../../data/db.js';
    import { DataTable, Format } from '../../components/ui.js';
    import { reports } from '../../api/reports.js';

    initShell(['PHARMACIST'], (session) => {
      const page = getPageContent();
      const stats = reports.getPharmacyStats();

      page.innerHTML = `
        <div class="page-header">
          <div class="page-header__info">
            <h1 class="text-page-title">Pharmacy Dashboard</h1>
            <p class="text-caption">Welcome back, ${Format.displayName(session.staffName, session.role)}</p>
          </div>
        </div>
        
        <div class="stat-row" style="margin-bottom:var(--sp-6);">
          <div class="stat-card">
            <div class="stat-card__icon" style="background:var(--primary-light);color:var(--primary);"><svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-file-text"></use></svg></div>
            <div class="stat-card__value">${stats.pendingRxCount}</div>
            <div class="stat-card__label">Pending Prescriptions</div>
          </div>
          <div class="stat-card">
            <div class="stat-card__icon" style="background:var(--danger-light);color:var(--danger);"><svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-alert-triangle"></use></svg></div>
            <div class="stat-card__value">${stats.lowStockCount}</div>
            <div class="stat-card__label">Low Stock Items</div>
          </div>
          <div class="stat-card">
            <div class="stat-card__icon" style="background:var(--warning-light);color:var(--warning-dark);"><svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-clock"></use></svg></div>
            <div class="stat-card__value">${stats.expiringSoonCount}</div>
            <div class="stat-card__label">Expiring Soon (90d)</div>
          </div>
          <div class="stat-card">
            <div class="stat-card__icon" style="background:var(--success-light);color:var(--success);"><svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-check-circle"></use></svg></div>
            <div class="stat-card__value">${stats.todaysDispensed}</div>
            <div class="stat-card__label">Items Dispensed Today</div>
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 2fr 1fr; gap: var(--sp-6);">
          <div class="card">
            <div class="card__header">
              <span class="text-card-title">Pending Prescription Queue</span>
            </div>
            <div id="queue-table"></div>
          </div>

          <div style="display:flex; flex-direction:column; gap:var(--sp-6);">
            <div class="card">
              <div class="card__header">
                <span class="text-card-title">Low Stock Alerts</span>
              </div>
              <div class="card__body" style="padding-top:0;">
                ${stats.lowStockList.length === 0 ? '<div class="text-caption">No low stock items.</div>' : ''}
                ${stats.lowStockList.slice(0, 5).map(m => `
                  <div style="border-bottom:1px solid var(--border); padding:var(--sp-2) 0;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                      <strong>${m.name}</strong>
                      <span style="color:var(--danger);font-weight:600;">${m.stockLevel} left</span>
                    </div>
                    <div class="text-body-sm">Reorder at ${m.reorderLevel}</div>
                  </div>
                `).join('')}
                ${stats.lowStockList.length > 5 ? `<div style="margin-top:var(--sp-2);"><a href="stock-alerts.html" class="text-link text-body-sm">View all alerts</a></div>` : ''}
              </div>
            </div>
          </div>
        </div>
      `;

      // Setup Table
      const columns = [
        { key: 'createdAt', label: 'Time', sortable: true, render: r => Format.time(r.createdAt.split('T')[1].slice(0,5)) },
        { key: 'patientId', label: 'Patient', sortable: true, render: r => `<strong>${(() => { try { return db.getById('patients', r.patientId).name; } catch(e){ return 'Unknown Patient'; } })()}</strong>` },
        { key: 'items', label: 'Items', sortable: false, render: r => r.items.length + ' med(s)' },
        { key: 'actions', label: '', width: '80px', render: r => `<a href="prescription-queue.html" class="btn btn--primary btn--sm">Go</a>` }
      ];

      new DataTable('queue-table', columns, stats.pendingRxList, { defaultSort: 'createdAt' });
    });
  </script>
</body>
</html>
