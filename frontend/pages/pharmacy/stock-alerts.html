<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Alerts — Clinova Healthcare</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg">
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/typography.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/forms.css">
  <link rel="stylesheet" href="../../assets/css/tables.css">
  <link rel="stylesheet" href="../../assets/css/utilities.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body>
  <div class="app" id="app"></div>
  <script type="module">
    import { initShell, getPageContent } from '../../components/app-shell.js';
    import { DataTable } from '../../components/ui.js';
    import { pharmacy } from '../../api/pharmacy.js';

    let alertsTable;

    initShell(['PHARMACIST', 'ADMIN'], () => {
      const page = getPageContent();
      page.innerHTML = `
        <div class="page-header">
          <div class="page-header__info">
            <h1 class="text-page-title">Stock Alerts</h1>
            <p class="text-caption">Low stock and items expiring within 90 days.</p>
          </div>
        </div>

        <div class="card">
          <div class="card__header" style="padding: var(--sp-3) var(--sp-4);">
            <div class="search-bar" style="max-width: 300px; margin: 0;">
              <span class="search-bar__icon"><svg class="icon icon--sm" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-search"></use></svg></span>
              <input type="text" class="search-bar__input" id="alert-search" placeholder="Search medicines...">
            </div>
          </div>
          <div id="alerts-table"></div>
        </div>
      `;

      const columns = [
        { key: 'name', label: 'Medicine', sortable: true, render: r => `<strong>${r.name}</strong>` },
        { key: 'issue', label: 'Alert Type', sortable: true, render: r => {
          if (r.type === 'LOW_STOCK') {
            return `<span style="color:var(--danger);font-weight:600;">Low Stock</span><br><span class="text-caption">Available: ${r.stockLevel} (Reorder: ${r.reorderLevel})</span>`;
          } else {
            return `<span style="color:var(--warning-dark);font-weight:600;">Expiring Soon</span><br><span class="text-caption">${r.batchQty} units expiring ${r.expiryDate}</span>`;
          }
        }},
        { key: 'actions', label: '', width: '150px', render: r => `
          <a href="purchases.html?medId=${r.id}" class="btn btn--primary btn--sm">
            <svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-shopping-cart"></use></svg> Create PO
          </a>
        `}
      ];

      alertsTable = new DataTable('alerts-table', columns, [], { searchInputId: 'alert-search', defaultSort: 'name' });
      alertsTable.sortAsc = true;
      loadAlerts();
    });

    function loadAlerts() {
      const meds = pharmacy.listMedicines().filter(m => m.isActive);
      const alerts = [];
      const todayObj = new Date();
      const ninetyDaysFromNow = new Date(todayObj.getTime() + (90 * 24 * 60 * 60 * 1000)).toISOString().split('T')[0];
      const today = todayObj.toISOString().split('T')[0];

      meds.forEach(m => {
        // Low Stock
        if (m.stockLevel <= m.reorderLevel) {
          alerts.push({
            id: m.id,
            name: m.name,
            type: 'LOW_STOCK',
            stockLevel: m.stockLevel,
            reorderLevel: m.reorderLevel
          });
        }
        
        // Expiring Soon (or expired)
        m.batches.forEach(b => {
          if (b.quantity > 0 && b.expiryDate <= ninetyDaysFromNow) {
            alerts.push({
              id: m.id,
              name: m.name,
              type: 'EXPIRY',
              expiryDate: b.expiryDate,
              batchQty: b.quantity
            });
          }
        });
      });

      alertsTable.updateData(alerts);
    }
  </script>
</body>
</html>
